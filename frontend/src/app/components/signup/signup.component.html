<div class="signup-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Sign Up</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" required>
          <mat-error *ngIf="signupForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="signupForm.get('email')?.hasError('email')">
            Invalid email format
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" required>
          <mat-error *ngIf="signupForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>
          <mat-error *ngIf="signupForm.get('password')?.hasError('minlength')">
            Password must be at least 6 characters
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Admin Key (Optional)</mat-label>
          <input matInput formControlName="adminKey" type="text">
          <mat-hint>Leave empty for customer account</mat-hint>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="loading || signupForm.invalid">
          <span *ngIf="!loading">Sign Up</span>
          <span *ngIf="loading">Signing up...</span>
        </button>
      </form>
    </mat-card-content>
    <mat-card-footer>
      <p>Already have an account? <a routerLink="/login">Login</a></p>
    </mat-card-footer>
  </mat-card>
</div>
