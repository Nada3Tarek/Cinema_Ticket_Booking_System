<div class="container">
  <h1>Browse Movies</h1>

  <div class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Search</mat-label>
      <input matInput [(ngModel)]="filters.search" (keyup.enter)="onSearch()">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Language</mat-label>
      <input matInput [(ngModel)]="filters.language" (keyup.enter)="onSearch()">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Sort By</mat-label>
      <mat-select [(ngModel)]="filters.sortBy" (selectionChange)="onSortChange()">
        <mat-option value="releaseDate">Release Date</mat-option>
        <mat-option value="rating">Rating</mat-option>
        <mat-option value="title">Title</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Order</mat-label>
      <mat-select [(ngModel)]="filters.sortOrder" (selectionChange)="onSortChange()">
        <mat-option value="desc">Descending</mat-option>
        <mat-option value="asc">Ascending</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="onSearch()">Apply Filters</button>
  </div>

  <div class="loading-spinner" *ngIf="loading">
    <mat-spinner></mat-spinner>
  </div>

  <div class="empty-state" *ngIf="!loading && movies.length === 0">
    <p>No movies found</p>
  </div>

  <div class="movie-grid" *ngIf="!loading && movies.length > 0">
    <mat-card class="movie-card" *ngFor="let movie of movies" [routerLink]="['/movies', movie._id]">
      <img mat-card-image [src]="movie.posterUrl || 'https://via.placeholder.com/300x450'" [alt]="movie.title">
      <mat-card-header>
        <mat-card-title>{{ movie.title }}</mat-card-title>
        <mat-card-subtitle>{{ movie.language }} • {{ movie.duration }} min</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ movie.description | slice:0:100 }}...</p>
        <div class="rating">
          <mat-icon>star</mat-icon>
          <span>{{ movie.rating | number:'1.1-1' }}</span>
        </div>
        <div class="genres">
          <mat-chip *ngFor="let g of movie.genre">{{ g }}</mat-chip>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <mat-paginator
    *ngIf="pagination && pagination.totalPages > 1"
    [length]="pagination.total"
    [pageSize]="pagination.limit"
    [pageIndex]="pagination.page - 1"
    (page)="onPageChange($event)"
    [pageSizeOptions]="[12, 24, 48]">
  </mat-paginator>
</div>
